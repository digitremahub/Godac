async function callAI(system, messages) {
  if (DEMO_MODE || !ANTHROPIC_KEY || ANTHROPIC_KEY.includes("VOTRE")) {
    await new Promise(r => setTimeout(r, 1200));
    const tips = {
      ia_reporting: `**Rapport généré** (mode démo)\n\nPour activer les vraies réponses IA :\n1. Obtenez une clé sur console.anthropic.com\n2. Remplacez VOTRE_CLE_ANTHROPIC_ICI dans le fichier HTML\n3. Redéployez sur Vercel\n\nEn production, je génèrerai des rapports contextualisés selon votre rôle "${system.includes("chauffeur") ? "chauffeur" : system.includes("exploitation") ? "exploitation" : system.includes("comptable") ? "comptable" : "direction"}".`,
      ia_anomalies: `**Analyse anomalies** (mode démo)\n\n3 anomalies détectées :\n- **+56,6% écart PMP** : Thomas Girard · UV-678-WX · Total Perpignan Sud · 1,955€/L vs PMP 1,248€/L\n- Cuve AdBlue sous le seuil critique\n- CT imminent AB-123-CD\n\nActivez votre clé API pour des analyses détaillées.`,
      ia_cuves: `**Analyse cuves** (mode démo)\n\n- Cuve Diesel PL : 61% · Autonomie estimée ~12 jours\n- Cuve Diesel VL : 72% · Autonomie estimée ~18 jours\n- **Cuve AdBlue : 36% ⚠️** · Sous le seuil · Réappro urgent\n\nPMP moyen pondéré flotte : 1,249€/L`,
      ia_rh: `**Agent RH** (mode démo)\n\nDemandes en attente :\n- Martin Dupont : Congés 14-25 juillet (10j)\n- Thomas Girard : Signalement véhicule UV-678-WX\n\nPour des réponses personnalisées sur vos droits (CCNTR, temps de repos PL, congés), activez votre clé API Anthropic.`,
      ia_finance: `**Analyse financière** (mode démo)\n\nTVA récupérable estimée :\n- **Gazole VL** (AB, EF, QR) : 80% récupérable\n- **Gazole PL** (IJ, MN, UV) : 100% récupérable\n- **AdBlue** : 0% récupérable\n\nTICPE remboursable PL > 7,5T : ~0,1567€/L\n\nActivez votre clé API pour les calculs précis.`,
    };
    const agentKey = Object.keys(tips).find(k => system.includes(k.replace("ia_", ""))) || "ia_reporting";
    return tips[agentKey] || "Mode démo actif. Ajoutez votre clé API Anthropic pour des réponses réelles.";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": ANTHROPIC_KEY, "anthropic-version": "2023-06-01" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system, messages }),
  });
  const d = await res.json();
  return d.content?.[0]?.text || "Erreur de réponse.";
}

Utilisateur: ${user.prenom} ${user.nom} — Rôle: ${user.role}

Anomalies prix: ${data.ravitaillements.filter(r=>r.statut==="alerte_prix").length}`;
};

const css = {
  surface: { background:"#141c2e", border:"1px solid #1e2d47", borderRadius:8 },
  gold: "#C9A84C", gold2: "#F0B429",
  red: "#e05252", green: "#34c28a", blue: "#4d8fff", orange: "#e07c34",
  text: "#c5d4e8", textMid: "#6b84a8", textDim: "#3d5070",
  bg: "#0a0e17", bg2: "#0f1521",
};

function Btn({ children, v="ghost", sm, onClick, disabled, style }) {
  const base = { padding:sm?"4px 10px":"7px 14px", borderRadius:6, fontSize:sm?10:12, letterSpacing:".05em", textTransform:"uppercase", border:"1px solid transparent", cursor:disabled?"not-allowed":"pointer", opacity:disabled?.4:1, transition:"all .12s", fontFamily:"inherit", ...style };
  const vs = { gold:{background:css.gold,borderColor:css.gold,color:"#0a0e17",fontWeight:700}, danger:{background:"rgba(224,82,82,.1)",borderColor:"rgba(224,82,82,.3)",color:css.red}, ghost:{background:"#1a2438",borderColor:"#253550",color:css.textMid}, outline:{background:"none",borderColor:"#253550",color:css.textMid} };
  return <button onClick={onClick} disabled={disabled} style={{...base,...vs[v]}}>{children}</button>;
}

function Inp({ ...p }) { return <input {...p} style={{width:"100%",padding:"9px 12px",background:"#0f1521",border:"1px solid #253550",borderRadius:8,color:css.text,fontSize:13,outline:"none",...p.style}}/>; }
function Sel({ children, ...p }) { return <select {...p} style={{width:"100%",padding:"9px 12px",background:"#0f1521",border:"1px solid #253550",borderRadius:8,color:css.text,fontSize:13,outline:"none",...p.style}}>{children}</select>; }
function Field({ label, children }) { return <div style={{marginBottom:13}}><label style={{fontFamily:"monospace",fontSize:9,color:css.textDim,letterSpacing:".12em",textTransform:"uppercase",display:"block",marginBottom:5}}>{label}</label>{children}</div>; }
function Badge({ children, color="#6b84a8" }) { return <span style={{fontFamily:"monospace",fontSize:9,padding:"2px 6px",borderRadius:3,background:color+"22",color,border:`1px solid ${color}44`,textTransform:"uppercase",letterSpacing:".06em",whiteSpace:"nowrap"}}>{children}</span>; }

function Gauge({ value, max, height=7 }) {
  const p = Math.round(value/max*100);
  const color = p<=15?css.red:p<=30?css.orange:css.green;
  return <div style={{height,background:"#1e2d47",borderRadius:height/2,overflow:"hidden"}}><div style={{width:`${p}%`,height:"100%",background:color,transition:"width .5s ease"}}/></div>;
}

function Card({ title, action, onAction, children, style }) {
  return <div style={{...css.surface,...style}}>
    {title&&<div style={{padding:"10px 14px",borderBottom:"1px solid #1e2d47",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <span style={{fontFamily:"monospace",fontSize:10,fontWeight:600,letterSpacing:".1em",textTransform:"uppercase",color:css.textMid}}>{title}</span>
      {action&&<button onClick={onAction} style={{background:"none",border:"none",color:css.gold,fontFamily:"monospace",fontSize:10,cursor:"pointer"}}>{action}</button>}
    </div>}
    <div style={{padding:"12px 14px"}}>{children}</div>
  </div>;
}

function Kpi({ label, value, unit, delta, deltaColor, color=css.gold }) {
  return <div style={{...css.surface,padding:"12px 14px",position:"relative",overflow:"hidden"}}>
    <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:color}}/>
    <div style={{fontFamily:"Georgia,serif",fontSize:26,fontWeight:700,color:css.text,lineHeight:1}}>{value}<span style={{fontFamily:"monospace",fontSize:10,color:css.textDim,marginLeft:3}}>{unit}</span></div>
    <div style={{fontFamily:"monospace",fontSize:9,color:css.textDim,marginTop:4,textTransform:"uppercase",letterSpacing:".05em"}}>{label}</div>
    {delta&&<div style={{fontFamily:"monospace",fontSize:9,marginTop:4,color:deltaColor||css.textDim}}>{delta}</div>}
  </div>;
}

function Modal({ open, title, onClose, children, footer }) {
  if (!open) return null;
  return <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(4px)"}}>
    <div style={{background:"#141c2e",border:"1px solid #253550",borderRadius:12,width:"100%",maxWidth:460,maxHeight:"90vh",overflow:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.5)"}}>
      <div style={{padding:"14px 18px",borderBottom:"1px solid #1e2d47",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontFamily:"monospace",fontSize:13,fontWeight:600,letterSpacing:".06em",textTransform:"uppercase",color:css.text}}>{title}</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:css.textDim,fontSize:18,cursor:"pointer"}}>✕</button>
      </div>
      <div style={{padding:"16px 18px"}}>{children}</div>
      {footer&&<div style={{padding:"10px 18px",borderTop:"1px solid #1e2d47",display:"flex",gap:8,justifyContent:"flex-end"}}>{footer}</div>}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════
// OCR UPLOAD
// ═══════════════════════════════════════════════
function OcrUpload({ docType, label, icon, onResult, compact }) {
  const [state, setState] = useState("idle");
  const ref = useRef();
  const handle = async (file) => {
    if (!file) return;
    setState("loading");
    const r = await ocrScan(file, docType);
    if (r.ok) { setState("done"); onResult(r.data); } else setState("error");
  };
  const bc = state==="done"?css.green:state==="error"?css.red:"#253550";
  return <div onClick={()=>ref.current?.click()} style={{border:`2px dashed ${bc}`,borderRadius:8,padding:compact?8:12,textAlign:"center",cursor:"pointer",transition:"all .15s",background:state==="done"?"rgba(52,194,138,.05)":"transparent"}}>
    <input ref={ref} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>handle(e.target.files[0])}/>
    {state==="loading"?<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><div style={{width:14,height:14,border:`2px solid ${css.gold}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 1s linear infinite"}}/><span style={{fontFamily:"monospace",fontSize:10,color:css.textMid}}>Analyse OCR...</span></div>
    :state==="done"?<span style={{fontFamily:"monospace",fontSize:10,color:css.green}}>✓ Données extraites</span>
    :<div><div style={{fontSize:compact?16:20,marginBottom:3}}>{icon}</div><div style={{fontFamily:"monospace",fontSize:9,color:css.textDim}}>{label}</div>{!compact&&<div style={{fontSize:8,color:css.textDim,marginTop:2}}>Appuyer pour photographier</div>}</div>}
  </div>;
}

// MODAL RAVITAILLEMENT
// ═══════════════════════════════════════════════
function ModalRav({ open, onClose, user, data, onSave }) {
  const [f, setF] = useState({ source:"cuve", quantite:"", prix_unitaire:"", km_compteur:"", cuve_id:data.cuves[0]?.id||"", vehicule_id:user.vehicule_id||data.vehicules[0]?.id||"", date_ravitaillement:new Date().toISOString().split("T")[0], station_nom:"" });
  const [ocrOk, setOcrOk] = useState({});
  const fill = (k,v) => setF(p=>({...p,[k]:v}));
  const handleTicket = d => { setF(p=>({...p,quantite:d.quantite||p.quantite,prix_unitaire:d.prix_unitaire||p.prix_unitaire,date_ravitaillement:d.date_ravitaillement||p.date_ravitaillement,station_nom:d.station_nom||p.station_nom})); setOcrOk(p=>({...p,ticket:true})); };
  const handleKm = d => { setF(p=>({...p,km_compteur:d.km_compteur||p.km_compteur})); setOcrOk(p=>({...p,km:true})); };
  const save = () => {
    if (!f.quantite||!f.prix_unitaire) { alert("Quantité et prix requis."); return; }
    const cuve = data.cuves.find(c=>c.id===f.cuve_id);
    const ecart = cuve ? Math.abs(Number(f.prix_unitaire)-cuve.pmp)/cuve.pmp*100 : 0;
    onSave({...f,id:"r"+Date.now(),chauffeur_id:user.id,statut:ecart>(data.entreprise.seuil_alerte_prix||15)?"alerte_prix":"ok",ecart_pmp_pct:ecart.toFixed(1),total_ttc:(Number(f.quantite)*Number(f.prix_unitaire)).toFixed(2)});
    onClose();
  };
  const chauffeurs = data.employes.filter(e=>e.role==="chauffeur");
  return <Modal open={open} title="⛽ Nouveau ravitaillement" onClose={onClose} footer={<><Btn v="outline" onClick={onClose}>Annuler</Btn><Btn v="gold" onClick={save}>Enregistrer</Btn></>}>
    <div style={{background:"rgba(201,168,76,.08)",border:"1px solid rgba(201,168,76,.2)",borderRadius:8,padding:12,marginBottom:14}}>
      <div style={{fontFamily:"monospace",fontSize:9,color:css.gold,letterSpacing:".1em",textTransform:"uppercase",marginBottom:8}}>📸 Scan OCR automatique</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <OcrUpload docType="ticket_carburant" label="Photo ticket" icon="🧾" onResult={handleTicket}/>
        <OcrUpload docType="compteur_km" label="Photo compteur" icon="🔢" onResult={handleKm}/>
      </div>
      {(ocrOk.ticket||ocrOk.km)&&<div style={{fontFamily:"monospace",fontSize:9,color:css.green,marginTop:6}}>{ocrOk.ticket?"✓ Ticket extrait":""} {ocrOk.km?"✓ Km extrait":""}</div>}
    </div>
    <Field label="Source"><Sel value={f.source} onChange={e=>fill("source",e.target.value)}><option value="cuve">Cuve sur site</option><option value="ticket_externe">Ticket station externe</option><option value="carte_carburant">Carte carburant</option></Sel></Field>
    {user.role!=="chauffeur"&&<Field label="Chauffeur"><Sel value={f.chauffeur_override||user.id} onChange={e=>fill("chauffeur_override",e.target.value)}>{chauffeurs.map(c=><option key={c.id} value={c.id}>{c.prenom} {c.nom}</option>)}</Sel></Field>}
    <Field label="Véhicule"><Sel value={f.vehicule_id} onChange={e=>fill("vehicule_id",e.target.value)}>{(user.role==="chauffeur"?data.vehicules.filter(v=>v.id===user.vehicule_id):data.vehicules).map(v=><option key={v.id} value={v.id}>{v.immatriculation} ({v.type.toUpperCase()}) — {v.marque} {v.modele}</option>)}</Sel></Field>
    {f.source==="cuve"?<Field label="Cuve"><Sel value={f.cuve_id} onChange={e=>fill("cuve_id",e.target.value)}>{data.cuves.map(c=><option key={c.id} value={c.id}>{c.nom} — {c.niveau_actuel.toLocaleString("fr-FR")}L · PMP {c.pmp.toFixed(3)}€/L</option>)}</Sel></Field>:<Field label="Station"><Inp value={f.station_nom} onChange={e=>fill("station_nom",e.target.value)} placeholder="Ex : Total A9 Perpignan"/></Field>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Quantité (L)"><Inp type="number" value={f.quantite} onChange={e=>fill("quantite",e.target.value)} placeholder="450"/></Field>
      <Field label="Prix / litre (€)"><Inp type="number" step="0.001" value={f.prix_unitaire} onChange={e=>fill("prix_unitaire",e.target.value)} placeholder="1.248"/></Field>
    </div>
    {f.quantite&&f.prix_unitaire&&<div style={{background:"rgba(201,168,76,.08)",borderRadius:6,padding:"6px 10px",marginBottom:10,fontFamily:"monospace",fontSize:11,color:css.gold}}>
      Total : {(Number(f.quantite)*Number(f.prix_unitaire)).toFixed(2)} €
      {(()=>{const c=data.cuves.find(x=>x.id===f.cuve_id);if(!c)return null;const e=Math.abs(Number(f.prix_unitaire)-c.pmp)/c.pmp*100;return e>5?<span style={{marginLeft:10,color:e>15?css.red:css.orange}}>⚠ Écart PMP : +{e.toFixed(1)}%</span>:null;})()}
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Km compteur"><Inp type="number" value={f.km_compteur} onChange={e=>fill("km_compteur",e.target.value)} placeholder="312800"/></Field>
      <Field label="Date"><Inp type="date" value={f.date_ravitaillement} onChange={e=>fill("date_ravitaillement",e.target.value)}/></Field>
    </div>
  </Modal>;
}

function ViewAgentsIA({ user, data }) {
  const available = AGENTS.filter(a=>can(user.role,a.id));
  const [activeId, setActiveId] = useState(available[0]?.id||"ia_reporting");
  const [convs, setConvs] = useState({});
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const chatRef = useRef();
  const agent = AGENTS.find(a=>a.id===activeId);
  const myConv = convs[activeId]||[];

  useEffect(()=>{ setTimeout(()=>{ if(chatRef.current) chatRef.current.scrollTop=chatRef.current.scrollHeight; },60); },[myConv,activeId]);

  const send = async (text) => {
    const msg = text||input.trim(); if(!msg||loading) return;
    setInput("");
    const nc = [...myConv,{role:"user",content:msg}];
    setConvs(p=>({...p,[activeId]:nc})); setLoading(true);
    try { const r=await callAI(agent.getSystem(user,data),nc.map(m=>({role:m.role,content:m.content}))); setConvs(p=>({...p,[activeId]:[...nc,{role:"assistant",content:r}]})); }

  const welcomes = {
    ia_reporting:`Bonjour ${user.prenom}. Je génère des rapports **adaptés à votre rôle "${user.role}"** — basés exclusivement sur vos données accessibles.${DEMO_MODE||!ANTHROPIC_KEY.startsWith("sk-")?" ⚠️ Mode démo actif.":""}`,
    ia_anomalies:`Bonjour ${user.prenom}. **${data.ravitaillements.filter(r=>r.statut==="alerte_prix").length} anomalie(s) de prix** détectée(s). Posez vos questions sur les écarts PMP et les actions correctives.`,
    ia_cuves:`Bonjour ${user.prenom}. **${data.cuves.filter(c=>c.niveau_actuel/c.capacite<.3).length} cuve(s) sous 30%**. Je calcule les PMP, l'autonomie et les réapprovisionnements optimaux.`,
    ia_rh:`Bonjour ${user.prenom}. ${user.role==="chauffeur"?"Je vous aide pour vos congés, droits au repos et questions véhicule.":data.rh_demandes.filter(d=>d.statut==="en_attente").length+" demande(s) en attente."} Convention collective Transport routier (CCNTR).`,
    ia_finance:`Bonjour ${user.prenom}. Je calcule TVA récupérable (VL 80% / PL 100%), TICPE et optimise vos achats carburant.`,
  };

      <div style={{flex:1,overflowY:"auto",padding:"8px 0"}}>
        {available.map(a=><button key={a.id} onClick={()=>setActiveId(a.id)} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"8px 12px",border:"none",borderLeft:`2px solid ${activeId===a.id?css.gold:"transparent"}`,background:activeId===a.id?"rgba(201,168,76,.08)":"none",color:activeId===a.id?css.gold:css.textMid,fontSize:12,fontWeight:activeId===a.id?500:400,fontFamily:"inherit",textAlign:"left",cursor:"pointer",transition:"all .12s"}}>
          <span style={{fontSize:15,width:20,textAlign:"center"}}>{a.icon}</span>{a.short}
          {(convs[a.id]||[]).length>0&&<div style={{marginLeft:"auto",width:6,height:6,borderRadius:"50%",background:css.gold,opacity:.6}}/>}
        </button>)}
      </div>
    </div>
    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
      <div style={{padding:"10px 16px",borderBottom:"1px solid #1e2d47",background:"#0f1521",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <div style={{width:34,height:34,borderRadius:8,background:"rgba(201,168,76,.08)",border:"1px solid rgba(201,168,76,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{agent?.icon}</div>
        <div><div style={{fontFamily:"Georgia,serif",fontSize:14,fontWeight:600}}>{agent?.label}</div><div style={{fontFamily:"monospace",fontSize:9,color:css.textDim}}>{agent?.caps?.join(" · ")} · Données filtrées: rôle {user.role}</div></div>

    <div style={{fontFamily:"Georgia,serif",fontSize:18,fontWeight:600,marginBottom:16}}>⚙️ Paramètres entreprise</div>
    <Card title="Identité" style={{marginBottom:14}}>
      <Field label="Nom de l'entreprise"><Inp value={ent.nom} onChange={e=>setEnt(p=>({...p,nom:e.target.value}))}/></Field>
      <Field label="Nom de l'application"><Inp value={ent.nom_app} onChange={e=>setEnt(p=>({...p,nom_app:e.target.value}))}/></Field>
    </Card>
    <Card title="Personnalisation des couleurs" style={{marginBottom:14}}>
      <div style={{background:ent.couleur_bg,borderRadius:8,padding:16,border:"1px solid #1e2d47",marginBottom:12}}>
        <div style={{fontFamily:"Georgia,serif",fontSize:20,fontWeight:700,color:ent.couleur_primaire}}>{ent.nom_app}</div>
        <div style={{fontFamily:"monospace",fontSize:10,color:ent.couleur_secondaire,marginTop:2}}>Fleet Management System</div>
        <div style={{background:ent.couleur_primaire,borderRadius:6,padding:"6px 12px",display:"inline-block",marginTop:8,color:ent.couleur_bg,fontFamily:"Georgia,serif",fontSize:11,fontWeight:700}}>Bouton principal</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {[["Couleur principale","couleur_primaire"],["Couleur secondaire","couleur_secondaire"],["Fond","couleur_bg"]].map(([l,k])=><Field key={k} label={l}><div style={{display:"flex",gap:6,alignItems:"center"}}><input type="color" value={ent[k]} onChange={e=>setEnt(p=>({...p,[k]:e.target.value}))} style={{width:34,height:30,borderRadius:4,border:"1px solid #253550",background:"none",cursor:"pointer"}}/><Inp value={ent[k]} onChange={e=>setEnt(p=>({...p,[k]:e.target.value}))} style={{fontSize:11}}/></div></Field>)}
      </div>
    </Card>
    <Card title="Paramètres flotte" style={{marginBottom:14}}>
      <Field label="Seuil alerte anomalie prix (%)"><Inp type="number" defaultValue={ent.seuil_alerte_prix||15} min={5} max={50}/></Field>
    </Card>
    <div style={{display:"flex",gap:8}}><Btn v="gold" onClick={save}>Sauvegarder</Btn><Btn v="ghost" onClick={()=>setEnt({couleur_primaire:"#C9A84C",couleur_secondaire:"#F0B429",couleur_bg:"#0a0e17",nom_app:"GODAC"})}>Réinitialiser</Btn></div>
  </div>;
}

// ═══════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════
function LoginScreen({ onLogin }) {
  const [role, setRole] = useState("");
  const [name, setName] = useState("");
  const roles = [
    {val:"chauffeur",icon:"🚛",label:"Chauffeur",sub:"Ravitaillement · Son véhicule · RH"},
    {val:"exploitation",icon:"📊",label:"Resp. Exploitation",sub:"Flotte · Équipe · Alertes · IA"},
    {val:"comptable",icon:"🧾",label:"Comptable",sub:"Finance · Cuves · TVA · Exports"},
    {val:"direction",icon:"🎯",label:"Direction",sub:"Accès total · Admin · Tous agents IA"},
  ];
  return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"radial-gradient(ellipse at 30% 40%, rgba(201,168,76,.07) 0%, transparent 60%), #0a0e17",padding:20}}>
    <div style={{width:"100%",maxWidth:400}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{fontFamily:"Georgia,serif",fontSize:52,fontWeight:700,letterSpacing:".1em",color:css.gold2,lineHeight:1}}>GODAC</div>
        <div style={{fontFamily:"monospace",fontSize:10,color:css.textDim,letterSpacing:".18em",textTransform:"uppercase",marginTop:6}}>Fleet Management System</div>
        {(DEMO_MODE||!ANTHROPIC_KEY.startsWith("sk-"))&&<div style={{marginTop:10,padding:"6px 12px",background:"rgba(224,82,82,.08)",border:"1px solid rgba(224,82,82,.2)",borderRadius:6,fontFamily:"monospace",fontSize:10,color:css.red}}>⚠️ Mode démo — Clé API non configurée</div>}
      </div>
      <div style={{background:"#141c2e",border:"1px solid #1e2d47",borderRadius:12,padding:22,boxShadow:"0 0 40px rgba(201,168,76,.05)"}}>
        <Field label="Prénom Nom"><Inp value={name} onChange={e=>setName(e.target.value)} placeholder="Ex : Martin Dupont"/></Field>
        <Field label="Votre rôle">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
            {roles.map(r=><button key={r.val} onClick={()=>setRole(r.val)} style={{padding:"10px 8px",background:role===r.val?"rgba(201,168,76,.08)":"#0f1521",border:`1px solid ${role===r.val?css.gold:"#253550"}`,borderRadius:8,textAlign:"left",cursor:"pointer",transition:"all .15s"}}>
              <div style={{fontSize:16,marginBottom:4}}>{r.icon}</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:12,fontWeight:700,color:css.text,letterSpacing:".04em"}}>{r.label}</div>
              <div style={{fontSize:9,color:css.textDim,marginTop:2,lineHeight:1.3}}>{r.sub}</div>
            </button>)}
          </div>
        </Field>
        <button onClick={()=>role&&onLogin({...DEMO.users[role],prenom:name.split(" ")[0]||DEMO.users[role].prenom,nom:name.split(" ")[1]||DEMO.users[role].nom})} disabled={!role} style={{width:"100%",padding:11,background:css.gold,border:`1px solid ${css.gold}`,borderRadius:8,color:"#0a0e17",fontFamily:"Georgia,serif",fontSize:15,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",cursor:role?"pointer":"not-allowed",opacity:role?1:.4,transition:"all .15s"}}>
          Accéder au tableau de bord →
        </button>
        <div style={{textAlign:"center",fontFamily:"monospace",fontSize:9,color:css.textDim,marginTop:10}}>Mode démo · Données fictives · Toutes permissions testables</div>
      </div>
    </div>
  </div>;
}

// ═══════════════════════════════════════════════
// NAV CONFIG
// ═══════════════════════════════════════════════
function getNavItems(role, data) {
  const alertesN = data.alertes.filter(a=>!a.resolu).length;
  const aiN = AGENTS.filter(a=>can(role,a.id)).length;
  return [
    {id:"dashboard",icon:"🏠",label:"Dashboard",section:"Exploitation",perm:"dashboard"},
    {id:"ravitaillements",icon:"⛽",label:"Ravitaillements",section:"Exploitation",perm:"ravitaillements",count:data.ravitaillements.length},
    {id:"cuves",icon:"🛢️",label:"Cuves",section:"Exploitation",perm:"cuves"},
    {id:"vehicules",icon:"🚛",label:"Véhicules",section:"Flotte",perm:"vehicules",count:data.vehicules.filter(v=>v.statut==="actif").length},
    {id:"employes",icon:"👥",label:"Employés",section:"Flotte",perm:"employes",count:data.employes.length},
    {id:"alertes",icon:"🚨",label:"Alertes",section:"Flotte",perm:"alertes",count:alertesN,alert:alertesN>0},
    {id:"agents_ia",icon:"🤖",label:"Agents IA",section:"IA",perm:AGENTS.find(a=>can(role,a.id))?.id,count:aiN},
    {id:"rh",icon:"👤",label:"Espace RH",section:"Services",perm:"ia_rh"},
    {id:"admin",icon:"⚙️",label:"Paramètres",section:"Admin",perm:"admin"},
  ].filter(n=>n.perm&&can(role,n.perm));
}

// ═══════════════════════════════════════════════
// APP PRINCIPALE
// ═══════════════════════════════════════════════
function GodacApp() {
  const [user, setUser] = useState(null);
  const [view, setView] = useState("dashboard");
  const [data, setData] = useState(JSON.parse(JSON.stringify(DEMO)));
  const [ravModal, setRavModal] = useState(false);
  const [mobNav, setMobNav] = useState(false);

  useEffect(()=>{ applyTheme(DEMO.entreprise); },[]);
  useEffect(()=>{ if(user) applyTheme(data.entreprise); },[data.entreprise]);

  if (!user) return <LoginScreen onLogin={u=>{setUser(u);setView("dashboard");}}/>;

  const navItems = getNavItems(user.role, data);
  const sections = [...new Set(navItems.map(n=>n.section))];
  const titles = {dashboard:"Dashboard",ravitaillements:"Ravitaillements",cuves:"Cuves Carburant",vehicules:user.role==="chauffeur"?"Mon véhicule":"Flotte Véhicules",employes:"Employés",alertes:"Alertes & Anomalies",agents_ia:"Agents IA Transport",rh:"Espace RH",admin:"Paramètres"};

  const SidebarContent = ({onClose}) => <>
    <div style={{padding:"14px 16px 10px",borderBottom:"1px solid #1e2d47"}}>
      <div style={{fontFamily:"Georgia,serif",fontSize:22,fontWeight:700,letterSpacing:".08em",color:css.gold2}}>{data.entreprise.nom_app}</div>
      <div style={{fontFamily:"monospace",fontSize:8,color:css.textDim,letterSpacing:".1em",textTransform:"uppercase"}}>Fleet Manager</div>
    </div>
    <div style={{padding:"10px 14px",borderBottom:"1px solid #1e2d47",display:"flex",alignItems:"center",gap:8}}>
      <div style={{width:28,height:28,borderRadius:6,background:"rgba(201,168,76,.1)",border:"1px solid rgba(201,168,76,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Georgia,serif",fontSize:12,fontWeight:700,color:css.gold,flexShrink:0}}>{user.prenom?.[0]}{user.nom?.[0]}</div>
      <div style={{minWidth:0}}><div style={{fontSize:11,fontWeight:500,color:css.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.prenom} {user.nom}</div><div style={{fontFamily:"monospace",fontSize:8,color:css.gold,textTransform:"uppercase",letterSpacing:".08em"}}>{user.role}</div></div>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"8px 0"}}>
      {sections.map(sec=>{const items=navItems.filter(n=>n.section===sec);if(!items.length)return null;return <div key={sec}>
        <div style={{padding:"6px 14px 3px",fontFamily:"monospace",fontSize:8,color:css.textDim,letterSpacing:".14em",textTransform:"uppercase"}}>{sec}</div>
        {items.map(item=><button key={item.id} onClick={()=>{setView(item.id);onClose?.();}} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"7px 12px",background:view===item.id?"rgba(201,168,76,.08)":"none",borderLeft:`2px solid ${view===item.id?css.gold:"transparent"}`,border:"none",color:view===item.id?css.gold:css.textMid,fontSize:12,fontWeight:view===item.id?500:400,fontFamily:"inherit",textAlign:"left",cursor:"pointer",transition:"all .12s"}}>
          <span style={{fontSize:13,width:16,textAlign:"center",flexShrink:0}}>{item.icon}</span>
          <span style={{flex:1}}>{item.label}</span>
          {item.count!==undefined&&<span style={{fontFamily:"monospace",fontSize:9,padding:"1px 5px",borderRadius:3,background:item.alert?"rgba(224,82,82,.1)":"#1a2438",color:item.alert?css.red:css.textDim,border:`1px solid ${item.alert?"rgba(224,82,82,.3)":"#1e2d47"}`,animation:item.alert?"pulse 2s infinite":"none"}}>{item.count}</span>}
        </button>)}
      </div>;})}
    </div>
    <div style={{padding:"10px 12px",borderTop:"1px solid #1e2d47"}}>
      <div style={{fontFamily:"monospace",fontSize:8,color:css.textDim,letterSpacing:".08em"}}>GODAC v2.0 · {data.entreprise.nom}</div>
      <button onClick={()=>{setUser(null);setView("dashboard");}} style={{background:"none",border:"none",color:css.textDim,fontFamily:"monospace",fontSize:8,cursor:"pointer",marginTop:4}}>← Déconnexion</button>
    </div>
  </>;

  return <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
    <style>{`
      @keyframes spin{to{transform:rotate(360deg);}}
      @keyframes blink{0%,60%,100%{transform:translateY(0);opacity:.3;}30%{transform:translateY(-3px);opacity:1;}}
      @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
      @media(max-width:700px){.godac-sb{display:none!important;}#mob-btn{display:flex!important;}}
    `}</style>

    <div className="godac-sb" style={{width:210,flexShrink:0,background:"#0f1521",borderRight:"1px solid #1e2d47",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <SidebarContent/>
    </div>

    {mobNav&&<><div onClick={()=>setMobNav(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:400}}/><div style={{position:"fixed",left:0,top:0,bottom:0,width:230,background:"#0f1521",borderRight:"1px solid #1e2d47",zIndex:401,display:"flex",flexDirection:"column"}}><SidebarContent onClose={()=>setMobNav(false)}/></div></>}

    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,overflow:"hidden"}}>
      <div style={{padding:"10px 18px",borderBottom:"1px solid #1e2d47",display:"flex",alignItems:"center",gap:10,background:"#0f1521",flexShrink:0}}>
        <button id="mob-btn" onClick={()=>setMobNav(true)} style={{display:"none",width:30,height:30,borderRadius:6,background:"#141c2e",border:"1px solid #1e2d47",alignItems:"center",justifyContent:"center",color:css.textMid,fontSize:14}}>☰</button>
        <div style={{fontFamily:"Georgia,serif",fontSize:16,fontWeight:600,letterSpacing:".04em",flex:1,textTransform:"uppercase"}}>{titles[view]||view}</div>
        {can(user.role,"ravitaillements")&&<Btn v="gold" sm onClick={()=>setRavModal(true)}>⛽ Ravitaillement</Btn>}
      </div>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {view==="dashboard"&&<ViewDashboard data={data} user={user} onNewRav={()=>setRavModal(true)} onView={setView}/>}
        {view==="ravitaillements"&&<ViewRavitaillements data={data} user={user} onNew={()=>setRavModal(true)}/>}
        {view==="cuves"&&can(user.role,"cuves")&&<ViewCuves data={data}/>}
        {view==="vehicules"&&<ViewVehicules data={data} user={user}/>}
        {view==="employes"&&can(user.role,"employes")&&<ViewEmployes data={data}/>}
        {view==="alertes"&&can(user.role,"alertes")&&<ViewAlertes data={data} user={user} onResolve={id=>setData(d=>({...d,alertes:d.alertes.map(a=>a.id===id?{...a,resolu:true}:a)}))}/>}
        {view==="agents_ia"&&<ViewAgentsIA user={user} data={data}/>}
        {view==="rh"&&can(user.role,"ia_rh")&&<ViewRH user={user} data={data}/>}
        {view==="admin"&&can(user.role,"admin")&&<ViewAdmin data={data} setData={setData}/>}
      </div>
    </div>

    <ModalRav open={ravModal} onClose={()=>setRavModal(false)} user={user} data={data} onSave={rav=>setData(d=>({...d,ravitaillements:[...d.ravitaillements,rav]}))}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GodacApp/>);
</script>
</body>
</html>
