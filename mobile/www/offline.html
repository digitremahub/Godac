<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GODAC Livreur — hors connexion</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0A0F1E; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; color: rgba(255,255,255,.7); font-size: 15px; line-height: 1.5; max-width: 320px; }
      button { border: 0; border-radius: 12px; background: #1BE4C1; color: #0A0F1E; font-weight: 700; font-size: 16px; padding: 14px 28px; }
    </style>
  </head>
  <body>
    <main>
      <img src="godac-symbol.svg" alt="" width="64" height="54" />
      <h1>Pas de connexion</h1>
      <p>GODAC Livreur a besoin d'internet pour charger votre tournée. Vérifiez la 4G ou le Wi-Fi puis réessayez.</p>
      <button type="button" onclick="location.href='https://godac.app/livreur'">Réessayer</button>
    </main>
  </body>
</html>
