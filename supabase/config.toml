project_id = "godac-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
# Invited/magic-link/reset users land here after clicking the email
# link (see app/auth/confirm/route.ts).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]

# Branded magic-link email for local development. This only affects
# the local Supabase stack (`supabase start`) — the hosted/production
# project has no config-file-based way to set email templates, so the
# same HTML must also be pasted into the Dashboard under Authentication
# > Email Templates > Magic Link for it to apply there.
[auth.email.template.magic_link]
subject = "Votre lien de connexion GODAC"
content_path = "./supabase/templates/magic_link.html"
