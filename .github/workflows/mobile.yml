name: Application GODAC Livreur

# Compile l'application des stores (dossier mobile/), à la demande depuis
# l'onglet Actions de GitHub (« Run workflow »). Voir mobile/STORES.md.
#  - Android : APK de test (toujours) + AAB signé pour Google Play (si les
#    secrets ANDROID_* sont renseignés).
#  - iOS : archive envoyée directement sur TestFlight (si les secrets
#    APPLE_* sont renseignés) — une compilation iOS exige un Mac, d'où le
#    runner macOS de GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée dans les stores (ex. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: APK de test
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: godac-livreur-test.apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: AAB signé pour Google Play
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Pas de clé de signature : AAB non produit (voir mobile/STORES.md)."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/godac.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/godac.keystore"
          cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: godac-livreur-google-play.aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilation et envoi sur TestFlight
        run: |
          if [ -z "$ASC_KEY_B64" ] || [ -z "$APPLE_TEAM_ID" ]; then echo "Secrets Apple absents : compilation iOS ignorée (voir mobile/STORES.md)."; exit 0; fi
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_B64" | base64 -d > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" $AUTH archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH
